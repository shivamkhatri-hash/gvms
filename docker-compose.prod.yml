name: gvms

services:
  postgres:
    image: postgres:16-alpine
    container_name: gvms-postgres-prod
    restart: always
    env_file:
      - production.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - gvms_postgres_prod_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - gvms-prod-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gvms-backend-prod
    restart: always
    env_file:
      - production.env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backups:/app/backups
    networks:
      - gvms-prod-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 10s
      retries: 3

  metabase:
    image: metabase/metabase:latest
    container_name: gvms-metabase-prod
    restart: always
    env_file:
      - production.env
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: ${POSTGRES_DB}
      MB_DB_PORT: 5432
      MB_DB_USER: ${POSTGRES_USER}
      MB_DB_PASS: ${POSTGRES_PASSWORD}
      MB_DB_HOST: postgres
      MB_ENABLE_EMBEDDING: "true"
    ports:
      - "3002:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - gvms-prod-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gvms-frontend-prod
    restart: always
    ports:
      - "3001:3000"
    depends_on:
      - backend
    networks:
      - gvms-prod-network

  nginx:
    image: nginx:alpine
    container_name: gvms-nginx-prod
    restart: always
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
      - metabase
    networks:
      - gvms-prod-network

volumes:
  gvms_postgres_prod_data:

networks:
  gvms-prod-network:
    driver: bridge
